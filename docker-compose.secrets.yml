# Docker Compose overlay for using Docker secrets instead of environment variables.
# This provides better security for sensitive data in production environments.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Required environment variables (will be converted to secrets):
#   - CVAT_POSTGRES_PASSWORD
#   - DJANGO_SECRET_KEY

x-backend-secrets: &backend-secrets
  environment:
    CVAT_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  secrets:
    - postgres_password
    - django_secret_key

services:
  cvat_server: *backend-secrets
  cvat_worker_utils: *backend-secrets
  cvat_worker_annotation: *backend-secrets
  cvat_worker_export: *backend-secrets
  cvat_worker_import: *backend-secrets
  cvat_worker_quality_reports: *backend-secrets
  cvat_worker_webhooks: *backend-secrets
  cvat_worker_chunks: *backend-secrets
  cvat_worker_consensus: *backend-secrets

secrets:
  postgres_password:
    environment: CVAT_POSTGRES_PASSWORD
  django_secret_key:
    environment: DJANGO_SECRET_KEY
